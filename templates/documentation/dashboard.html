{% extends 'base.html' %}
{% block content%}
{% load crispy_forms_tags %}
<div class="row position-relative">
<div class="col">
  <div class="card">
    <div class="card-body">
      <h5 class="card-title">Documentation Dashboard</h5>
        <div class="row">
          <form method="post" >
            {% csrf_token %}
            {{ classes_form|crispy }}
            <button type="submit" name="submit">Submit</button>
          </form>

        </div>

         <ul>
           {% for doc in object_list %}
           <li>{{ doc.id }} {{ doc.file }} {{ doc.description }}</li>
           {% endfor %}
         </ul>
    </div>

  </div>

</div>
</div>

{% endblock%}
