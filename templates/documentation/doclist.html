{% extends 'base.html' %}
{% block content%}
{% load crispy_forms_tags %}
<div class="row position-relative">
<div class="col">
  <div class="card">
    <div class="card-body">
      <h5 class="card-title">Documentation List</h5>

         <ul>
           {% for doc in object_list %}
           <li>{{ doc.id }} {{ doc.file }} {{ doc.description }}</li>
           {% endfor %}
         </ul>
    </div>

  </div>

</div>
</div>

{% endblock%}
