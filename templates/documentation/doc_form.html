{% load crispy_forms_tags %}
{% load mathfilters %}
<script type="text/javascript">
  $(document).ready(function(){
    let formIndex = {{ formset.total_form_count }}-1;
    $('#add_file_btn').click(function(){
      const form = $('#formset_container_form-' +
        formIndex).prop('outerHTML').replaceAll('form-'+ formIndex.toString(), 'form-' + (formIndex+1).toString());
      $('#formset_container_form-' + formIndex).after(form);
      console.log(form);
      $('#id_form-' + (formIndex+1).toString() + '-parent').val($('#id_form-' + (formIndex).toString() + '-parent').val())
      const totalForms = $('#id_form-TOTAL_FORMS');
      totalForms.val(parseInt(totalForms.val(), 10) + 1);
      formIndex++;

    });
    $('#doc_form').submit(function(event){
    event.preventDefault();
      var formData = new FormData($('#doc_form')[0]);
      $.ajax({
        url: '{% url 'doc_create' model=model %}',
        type:'POST',
        data: formData,
        processData: false,
        contentType: false,
        success: function(result){
          $('#doc_form_content').html(result);
        },
        error: function(er){
          alert("We have an error " + er);
        }

      });
    });
  });

  function deleteDoc(id) {
    if(confirm('Are you sure you want to delete this file?')){
      $.ajax({
        url: '/documentation/doc/delete/{{ model }}/' + id,
        type: 'POST',
        data: {
          'doc_id': id,
          'csrfmiddlewaretoken': '{{ csrf_token }}',

        },
        success: function(response) {
          $('#li_'+response.id).remove();
        },
        error: function(xhr){
          alert('An error occurred ' + xhr.responseText)
        },
      });
    }
  }
</script>
{% if existing_files %}
<h4>Existing Documentation</h4>
<div class="row">

    <ul>
      {% for doc in existing_files %}
      <li id="li_{{ doc.id }}">
          <button type="button" class="btn btn-danger btn-sm delete-doc" data-doc_id="{{ doc.id }}" onclick="deleteDoc({{ doc.id }})">Delete</button>
          <a href="{{ doc.file.url }}" target="_blank">{{ doc.file.name }}</a>

      </li>
      {% endfor %}
    </ul>


</div>
{% endif %}
<div class="row">

  <form id="doc_form" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ formset.management_form }}


    <div id="formset_container_form-{{ formset.total_form_count|sub:1 }}">
      {% for f in formset %}
        {{ f | crispy}}
      {% endfor %}
    </div>
    <button type="button" name="button" class="btn secondary-btn" id="add_file_btn">Add Doc</button>
    <button id="doc_submit_btn" class="btn btn-primary"  type="submit" name="">Submit</button>
  </form>
</div>
