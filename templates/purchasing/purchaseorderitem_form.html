{% load crispy_forms_tags %}
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script type="text/javascript">
  $(document).ready(function(){
    $("#id_item").select2({
      ajax: {
        url: '{% url "search-items" %}',
        dataType: 'json',
        delay: 250,
        data: function (params) {
            return {
                query: params.term
            };
        },
        processResults: function (data) {
            return {
                results: data.results
            };
        },
        cache: true
      },
      minimumInputLength: 2,
      placeholder: "Search items",
      allowClear: true

    });
  });

</script>
<script type="text/javascript">
  function getTotalCost() {
    $('#id_total_cost').val($('#id_unit_cost').val()*$('#id_quantity').val())
  }
  $(document).ready(function(){
    $('#id_unit_cost').change(function(val){
      getTotalCost();
    });
    $('#id_quantity').change(function(val){
      getTotalCost();
    });

  });
</script>
<div class="card">
  <div class="card-body">
    <h5 class="card-title">Purchase order form</h5>
    {% if update %}
      <form method="post" action = "{% url 'poi-update' pk=object.id %}">
    {% else %}
      <form method="post" action = "{% url 'poi-create' %}">
    {% endif %}
      {% csrf_token %}
      {{ pi_form|crispy }}
      {{ poi_form|crispy }}
      <input type="submit" class="btn primary-btn">
    </form>

  </div>

</div>
