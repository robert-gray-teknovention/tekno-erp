{% extends 'purchasing/base.html' %}
{% block purchasing_content %}
{% load crispy_forms_tags %}
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script type="text/javascript">
  $(document).ready(function(){
    $("#id_item_type").change(function(){
      window.location.replace('{% url "item-form" %}' + $(this).val())
    });
  });
</script>
<div class="card">
  <div class="card-body">
    <h5 class="card-title">

    </h5>
    {% if update %}
    <h5 class="card-title">
      Update {{ item_type }} Form
    </h5>
      <form method="post" action = "{% url form_url item_type=item_type pk=object.pk %}">
    {% else %}
    <h5 class="card-title">
      New {{ item_type }} Form
    </h5>
      <form method="post" action = "{% url form_url item_type=item_type %}">
    {% endif %}
      {% csrf_token %}
      {{ item_type_form|crispy }}
      {{ form|crispy }}
      <input type="submit" class="btn primary-btn">
    </form>

  </div>

</div>
{% endblock %}
