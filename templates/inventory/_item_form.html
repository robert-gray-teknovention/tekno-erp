{% load crispy_forms_tags %}
<script>
  $(document).ready(function(){
    $('form').submit(function(event){
      $('#inventory_item_form :input').prop('disabled', false);
    });
  }); 
</script>
{% if form_type == 'create'%}
  <form id="inventory_item_form" method="post" action="{% url 'inventory_add' model_name initial_id success_url %}">
{% else %}
<form id="inventory_item_form" method="post" action="{% url 'inventory_edit' pk model_name initial_id success_url %}">
{% endif %}

    {% csrf_token %}
    {{ form | crispy }}
    <button type="submit" class="btn btn-primary">Save</button>
  </form>
  <a href="{% url 'inventory_list' model_name %}">Back to List</a>
