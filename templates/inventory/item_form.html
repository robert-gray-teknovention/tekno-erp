{% extends "main_base.html" %}
{% load crispy_forms_tags %}


{% block main_content %}

  <form method="post" action="{% url 'inventory_add' model_name initial_id template_name %} ">
    {% csrf_token %}
    {{ form | crispy }}
    <button type="submit" class="btn btn-primary">Save</button>
  </form>
  <a href="{% url 'inventory_list' %}">Back to List</a>
{% endblock %}
