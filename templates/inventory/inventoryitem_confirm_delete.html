{% extends 'main_base.html' %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Delete {{ object }}</h5>
        {% url success_url initial_id %}
        <p>Are you sure you want to delete this inventory item?</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Delete</button>
          {% if success_url and initial_id %}
            <a class="btn btn-secondary" href="{% url success_url initial_id %}">Cancel</a>
          {% elif success_url %}
            <a class="btn btn-secondary" href="{% url success_url %}">Cancel</a>
          {% else %}
            <a class="btn btn-secondary" href="{% url 'inventory_list' %}">Cancel</a>
          {% endif %}
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
