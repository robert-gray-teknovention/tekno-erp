{% extends 'base.html' %}

{% block title %} | Project Management {% endblock %}

{% block content %}

{% load render_table from django_tables2%}
{% load django_bootstrap5%}
<script type="text/javascript">
  $(document).ready(function(){
    $('#add_project_btn').on('click', function(){
      window.location = "{% url 'project_create' %}";
    });

  });

</script>

      <div class="row">
        <div class="mx-auto">

            <div class="card-header bg-primary text-white">
              <h4>
                <i class="fa fa-address-book-o"></i> Project List
                <button id='add_project_btn' type="button" name="button" class="btn btn-light pull-right">Add {{ model_name }}</button>
              </h4>
            </div>
            <div class="card-body">
              {% if filter %}
                <form method="get" class="form form-inline">
                  <input type="text" name="search" placeholder="Search...">
                  {% bootstrap_button 'filter' %}
                </form>
              {% endif %}
              {% render_table table %}

            </div>

        </div>
      </div>
{% endblock %}
