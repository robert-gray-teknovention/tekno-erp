{% extends "main_base.html" %}
{% load crispy_forms_tags %}


{% block main_content %}
{% include 'partials/_select2_include.html' %}
<script>
  $(document).ready(function(){
    $("#id_parent").select2({
      ajax: {
        url: '{% url "search_locations" %}',
        dataType: 'json',
        delay: 250,

        data: function (params) {
            return {
                query: params.term,
            };
        },
        processResults: function (data) {
            return {
                results: data.results
            };
        },
        cache: true
      },
      minimumInputLength: 3,
      placeholder: "Search Locations",
      allowClear: true

    });
  });
    

</script>
  <form method="post">
    {% csrf_token %}
    {{ form | crispy }}
    <button type="submit" class="btn btn-primary">Save</button>
    {% if object.id %}
    <a href="{% url 'location_detail' object.id %}">Cancel</a>
    {% elif parent_id %}
    <a href="{% url 'location_detail' parent_id %}">Cancel</a>
    {% else %}
    <a href="{% url 'location_tree' %}">Cancel</a>
    {% endif %}
  </form>
  

  <a href="{% url 'location_tree' %}">Back to List</a>
{% endblock %}
