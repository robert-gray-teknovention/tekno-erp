{% extends 'main_base.html' %}
{% block main_content %}
<div class="row position-relative">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Delete Work Entry</h5>
        <p>Are you sure you want to delete this Work Entry: <strong>{{ object }}</strong>?</p>
        <form method="post">
          {% csrf_token %}
          {% if request.GET.next %}
            <input type="hidden" name="next" value="{{ request.GET.next }}" />
          {% endif %}
          <button class="btn btn-danger" type="submit">Delete</button>
          {% if request.GET.next %}
            <a class="btn btn-secondary" href="{{ request.GET.next }}">Cancel</a>
          {% else %}
            <a class="btn btn-secondary" href="{% url 'workorders:workentry-list' %}">Cancel</a>
          {% endif %}
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
