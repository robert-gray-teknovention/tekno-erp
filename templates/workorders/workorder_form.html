{% extends 'main_base.html' %}
{% load crispy_forms_tags %}
{% block main_content %}
<div class="row position-relative">
  <div class="col">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Work Order</h5>
        <form method="post">
          {% csrf_token %}
          {{ form|crispy }}
          <button class="btn btn-primary" type="submit">Submit</button>
          <a class="btn btn-secondary" href="{% url 'workorders:workorder-list' %}">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
