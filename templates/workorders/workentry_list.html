{% extends 'main_base.html' %}
{% load render_table from django_tables2 %}
{% block main_content %}
<div class="row position-relative">
  <div class="col-md-8">
    <h5>Work Entries
      <a class="btn btn-primary float-right" href="{% url 'workorders:workentry-add' %}">Add Work Entry</a>
    </h5>
  </div>
</div>

<div class="row mt-3">
  <div class="col-md-8">
    <form method="get" class="mb-2 d-flex">
      <input type="text" name="q" value="{{ q|default:'' }}" placeholder="Search work entries" class="form-control me-2">
      <button class="btn btn-outline-secondary" type="submit">Search</button>
      <a class="btn btn-link ms-2" href="{% url 'workorders:workentry-list' %}">Clear</a>
    </form>
  </div>
</div>

<div class="row position-relative mt-1">

  {% render_table table %}

</div>

{% endblock %}
